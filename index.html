<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>بازی برای بچه‌های نابغه</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.fontcdn.ir/Font/Persian/Vazirmatn/Vazirmatn.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(to bottom, #fff8e1, #ffe0b2);
      direction: rtl;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }
    h1 {
      font-size: 1.8em;
      color: #d84315;
      margin-bottom: 15px;
    }
    .character {
      font-size: 1.3em;
      margin-bottom: 12px;
      color: #4e342e;
    }
    .question-box {
      background-color: #fff3cd;
      border: 2px dashed #f0ad4e;
      padding: 20px;
      margin: 20px auto;
      max-width: 420px;
      border-radius: 16px;
      box-shadow: 0 0 12px rgba(240, 173, 78, 0.4);
    }
    .options button, .next-btn {
      font-size: 1.2em;
      margin: 6px;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
    .options button {
      background-color: #b3e5fc;
      color: #01579b;
    }
    .options button:hover {
      background-color: #81d4fa;
      transform: scale(1.05);
      transition: 0.3s;
    }
    .next-btn {
      background-color: #43a047;
      color: white;
      display: none;
    }
    .next-btn:hover {
      background-color: #2e7d32;
      transform: scale(1.05);
      transition: 0.3s;
    }
    .feedback {
      font-size: 1.3em;
      margin-top: 18px;
      color: #1b5e20;
      transition: all 0.5s ease-in-out;
    }
    input[type="text"] {
      font-size: 1.3em;
      padding: 10px;
      width: 100px;
      text-align: center;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .celebration {
      font-size: 2em;
      animation: pop 0.6s ease-in-out;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }
    .score-box {
      font-size: 1.2em;
      margin-top: 10px;
      color: #6d4c41;
    }
    .star {
      position: fixed;
      font-size: 2em;
      animation: fall 3s linear forwards;
      pointer-events: none;
    }
    @keyframes fall {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(100vh) rotate(360deg);
      }
    }
    .emoji-burst {
      position: fixed;
      font-size: 2.5em;
      animation: burst 1.5s ease-out forwards;
      pointer-events: none;
    }
    @keyframes burst {
      0% {
        opacity: 1;
        transform: scale(0) translate(0, 0);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: scale(1.5) translate(var(--tx), var(--ty));
      }
    }
  </style>
</head>
<body>
  <h1>🎓 بازی برای بچه‌های نابغه</h1>
  <div class="character" id="character-dialog">🧠 سلام خانم/آقای دکتر! آماده‌ای یه بازی باحال انجام بدیم؟</div>
  <div class="question-box" id="question-box"></div>
  <div class="feedback" id="feedback"></div>
  <div class="score-box" id="score-box">امتیاز: ۰</div>
  <button class="next-btn" id="next-btn">مرحله بعد</button>
  
  <audio id="correct-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLYiTcIGWi77eefTRAMUKfj8LZjHAY4ktfyy3ksBSR3x/DdkEAKFF606+uoVRQKRp/g8r5sIQUrgs7y14k4CBlouevm" type="audio/wav">
  </audio>
  
  <audio id="wrong-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
  </audio>

<script>
function toPersian(num) {
  return num.toString().replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
}
function normalizeInput(val) {
  return val.replace(/[۰۱۲۳۴۵۶۷۸۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).trim();
}
function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

// ایموجی‌های تشویقی
const encouragementEmojis = ['🌟', '⭐', '✨', '💫', '🎉', '🎊', '🏆', '👏', '💪', '🔥'];
const successMessages = [
  'عالی بود! 🌟',
  'آفرین نابغه! 🎉',
  'تو خیلی باهوشی! ✨',
  'واو! درست حدس زدی! 💫',
  'فوق‌العاده! 🏆',
  'چه حرفه‌ای! 👏',
  'مغزت داغ می‌کنه! 🔥',
  'یه نابغه واقعی! 💪',
  'بی‌نظیر! 🌟',
  'عجب استعدادی! ⭐'
];

const retryMessages = [
  'اشکالی نداره! دوباره تلاش کن 💪',
  'نزدیک بودی! یه بار دیگه امتحان کن 🌟',
  'فکر کن می‌تونی! 🧠',
  'تو قدرتشو داری! دوباره سعی کن ✨',
  'هیچ عیبی نداره! دوباره امتحان کن 💫'
];

// افکت بارش ستاره
function createStarShower() {
  for (let i = 0; i < 15; i++) {
    setTimeout(() => {
      const star = document.createElement('div');
      star.className = 'star';
      star.innerText = shuffle(encouragementEmojis)[0];
      star.style.left = Math.random() * 100 + '%';
      star.style.top = '-50px';
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 3000);
    }, i * 100);
  }
}

// افکت انفجار ایموجی
function createEmojiBurst() {
  const emojis = ['🎉', '⭐', '✨', '💫', '🌟', '🏆'];
  for (let i = 0; i < 8; i++) {
    const emoji = document.createElement('div');
    emoji.className = 'emoji-burst';
    emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
    emoji.style.left = '50%';
    emoji.style.top = '50%';
    const angle = (i / 8) * 2 * Math.PI;
    const distance = 150;
    emoji.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
    emoji.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
    document.body.appendChild(emoji);
    setTimeout(() => emoji.remove(), 1500);
  }
}

// پخش صدا
function playSound(correct) {
  try {
    const sound = document.getElementById(correct ? 'correct-sound' : 'wrong-sound');
    sound.currentTime = 0;
    sound.play().catch(e => console.log('Audio play failed:', e));
  } catch (e) {
    console.log('Audio error:', e);
  }
}

// ساخت سوالات تصادفی و متنوع
const allPairs = [];
for (let a = 0; a <= 10; a++) {
  for (let b = 0; b <= 10; b++) {
    allPairs.push({ a, b });
  }
}
const shuffled = shuffle(allPairs).slice(0, 45);

function makeQuestion(pair, index) {
  const { a, b } = pair;
  const product = a * b;
  if (index % 5 === 2) {
    return {
      type: "story",
      text: `اگر ${toPersian(a)} تا جعبه داشته باشی و در هر کدام ${toPersian(b)} مداد باشد، چند مداد داری؟`,
      answer: product
    };
  } else {
    return {
      type: index % 2 === 0 ? "test" : "input",
      a, b
    };
  }
}

const easy = shuffled.slice(0, 15).map((p, i) => makeQuestion(p, i));
const medium = shuffled.slice(15, 30).map((p, i) => makeQuestion(p, i));
const hard = shuffled.slice(30, 45).map((p, i) => makeQuestion(p, i));

const levels = [
  { name: "آسان", questions: easy },
  { name: "متوسط", questions: medium },
  { name: "پیشرفته", questions: hard }
];

let levelIndex = 0;
let current = 0;
let wrongCount = 0;
let score = 0;

function updateScoreDisplay() {
  document.getElementById("score-box").innerText = `امتیاز: ${toPersian(score)}`;
}

function showLevelIntro() {
  document.getElementById("question-box").innerHTML = `
    <h2>مرحله ${levels[levelIndex].name}</h2>
    <p>🧠 آماده‌ای برای سوال‌های ${levels[levelIndex].name}؟</p>
    <button class="next-btn" style="display:inline-block;" onclick="startLevel()">شروع مرحله</button>
  `;
  document.getElementById("character-dialog").innerText = "🌟 بزن بریم!";
  document.getElementById("feedback").innerText = "";
}

function startLevel() {
  current = 0;
  showQuestion();
}

function showQuestion() {
  const q = levels[levelIndex].questions[current];
  const box = document.getElementById("question-box");
  const feedback = document.getElementById("feedback");
  const nextBtn = document.getElementById("next-btn");
  feedback.innerText = "";
  nextBtn.style.display = "none";
  wrongCount = 0;

  document.getElementById("character-dialog").innerText =
    `👩‍🔬 سوال ${toPersian(current + 1)} از مرحله ${levels[levelIndex].name} | خانم/آقای دکتر، آماده‌ای؟`;

  if (q.type === "story") {
    box.innerHTML = `<p>${q.text}</p>
      <input type="text" id="answer-input" placeholder="پاسخ را وارد کن">
      <button onclick="submitInput(${q.answer}, null, null)">بررسی پاسخ</button>`;
  } else {
    const questionText = `حاصل ${toPersian(q.a)} × ${toPersian(q.b)} چند می‌شه؟`;
    box.innerHTML = `<p>${questionText}</p>`;
    if (q.type === "test") {
      const correct = q.a * q.b;
      let options = [correct];
      while (options.length < 4) {
        let fake = Math.floor(Math.random() * 101);
        if (!options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      const buttons = options.map(opt =>
        `<button onclick="checkAnswer(${opt}, ${correct}, '${q.a}', '${q.b}')">${toPersian(opt)}</button>`
      ).join("");
      box.innerHTML += `<div class="options">${buttons}</div>`;
    } else {
      box.innerHTML += `
        <input type="text" id="answer-input" placeholder="پاسخ را وارد کن">
        <button onclick="submitInput(${q.a * q.b}, '${q.a}', '${q.b}')">بررسی پاسخ</button>
      `;
    }
  }
}

function checkAnswer(selected, correct, a, b) {
  const feedback = document.getElementById("feedback");
  const nextBtn = document.getElementById("next-btn");
  
  if (selected === correct) {
    score++;
    updateScoreDisplay();
    
    // انتخاب پیام تشویقی تصادفی
    const msg = successMessages[Math.floor(Math.random() * successMessages.length)];
    feedback.innerHTML = `<div class="celebration">${msg}</div>`;
    
    // افکت‌های بصری و صوتی
    playSound(true);
    createStarShower();
    createEmojiBurst();
    
    nextBtn.style.display = "inline-block";
  } else {
    wrongCount++;
    playSound(false);
    
    if (wrongCount === 1) {
      const msg = retryMessages[Math.floor(Math.random() * retryMessages.length)];
      feedback.innerText = msg;
    } else {
      if (a && b) {
        feedback.innerText = `پاسخ درست ${toPersian(correct)} هست چون ${toPersian(a)} × ${toPersian(b)} یعنی ${toPersian(b)} بار ${toPersian(a)} که می‌شه ${toPersian(correct)}. 📚`;
      } else {
        feedback.innerText = `پاسخ درست ${toPersian(correct)} هست. خیلی خوب تلاش کردی! 🌟`;
      }
      nextBtn.style.display = "inline-block";
    }
  }
}

function submitInput(correct, a, b) {
  const input = document.getElementById("answer-input").value;
  const val = parseInt(normalizeInput(input));
  checkAnswer(val, correct, a, b);
}

document.getElementById("next-btn").onclick = () => {
  current++;
  if (current < levels[levelIndex].questions.length) {
    showQuestion();
  } else {
    levelIndex++;
    if (levelIndex < levels.length) {
      showLevelIntro();
    } else {
      const box = document.getElementById("question-box");
      const dialog = document.getElementById("character-dialog");
      const feedback = document.getElementById("feedback");
      const nextBtn = document.getElementById("next-btn");
      nextBtn.style.display = "none";

      let finalMessage = "";
      let finalEmoji = "";
      if (score >= 35) {
        finalMessage = "🌟 آفرین نابغه! تو واقعاً جدول ضرب رو بلدی! 👏👏";
        finalEmoji = "🏆🌟✨💫🎉";
      } else if (score >= 25) {
        finalMessage = "👍 خیلی خوب بودی! فقط چندتا تمرین دیگه و عالی می‌شی!";
        finalEmoji = "⭐💪🌟";
      } else {
        finalMessage = "💡 نابغه کوچک! خوب تلاش کردی، اما بهتره یه بار دیگه تمرین کنی تا بهتر یاد بگیری!";
        finalEmoji = "💪📚🌟";
      }

      box.innerHTML = `
        <h2>پایان بازی!</h2>
        <p>${finalMessage}</p>
        <p>امتیاز نهایی: ${toPersian(score)} از ${toPersian(45)}</p>
        <div style="font-size:2.5em; margin-top:10px;">${finalEmoji}</div>
      `;
      dialog.innerText = "👏👏👏 آفرین به تو!";
      feedback.innerText = "";
      
      // جشن پایان بازی
      createStarShower();
      createEmojiBurst();
      playSound(true);
    }
  }
};

showLevelIntro();
</script>
</body>
</html>
